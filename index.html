  const canaisDiv = document.getElementById("canais");

  const playerContainer = document.getElementById("player-container");

  const titulo = document.getElementById("titulo");

  const pesquisa = document.getElementById("pesquisa");

  let hls = null;


  /*
  ============================================================
  MOSTRAR CANAIS
  ============================================================
  */

  function mostrarCanais(lista) {

    canaisDiv.innerHTML = "";

    if (lista.length === 0) {

      canaisDiv.innerHTML = `
        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:30px;
          color:#999;
        ">
          Nenhum canal encontrado.
        </div>
      `;

      return;
    }

    lista.forEach((canal, index) => {

      const div = document.createElement("div");

      div.className = "canal";

      div.innerHTML = `
        <div class="canal-logo">📺</div>
        <div class="canal-nome">
          ${escaparHTML(canal.nome)}
        </div>
      `;

      div.addEventListener("click", function() {
        reproduzirCanal(canal);
      });

      canaisDiv.appendChild(div);

    });

    statusDiv.innerText =
      `${lista.length} canal(is) disponível(is)`;

  }


  /*
  ============================================================
  PESQUISA
  ============================================================
  */

  function filtrarCanais() {

    const termo =
      pesquisa.value
        .toLowerCase()
        .trim();

    const filtrados =
      canais.filter(canal =>
        canal.nome
          .toLowerCase()
          .includes(termo)
      );

    mostrarCanais(filtrados);

  }


  /*
  ============================================================
  PLAYER
  ============================================================
  */

  function reproduzirCanal(canal) {

    if (hls) {

      hls.destroy();
      hls = null;

    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    erroPlayer.style.display = "none";

    canaisDiv.style.display = "none";
    statusDiv.style.display = "none";
    playerContainer.style.display = "block";

    titulo.innerText =
      "📺 " + canal.nome;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


    /*
    HLS.JS
    */

    if (
      window.Hls &&
      Hls.isSupported()
    ) {

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      hls.loadSource(canal.url);

      hls.attachMedia(video);

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function() {

          video.play().catch(function() {});

        }
      );

      hls.on(
        Hls.Events.ERROR,
        function(event, data) {

          console.error(
            "Erro HLS:",
            data
          );

          if (data && data.fatal) {

            erroPlayer.style.display =
              "block";

          }

        }
      );

    }

    /*
    HLS NATIVO
    */

    else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = canal.url;

      video.addEventListener(
        "loadedmetadata",
        function() {

          video.play().catch(function() {});

        },
        {
          once: true
        }
      );

    }

    else {

      erroPlayer.style.display =
        "block";

    }

  }


  /*
  ============================================================
  VOLTAR
  ============================================================
  */

  function voltarCanais() {

    video.pause();

    video.removeAttribute("src");

    video.load();

    if (hls) {

      hls.destroy();
      hls = null;

    }

    playerContainer.style.display = "none";

    canaisDiv.style.display = "grid";
    statusDiv.style.display = "block";

    mostrarCanais(
      canais.filter(canal => {

        const termo =
          pesquisa.value
            .toLowerCase()
            .trim();

        return canal.nome
          .toLowerCase()
          .includes(termo);

      })
    );

  }


  /*
  ============================================================
  ESCAPAR HTML
  ============================================================
  */

  function escaparHTML(texto) {

    return String(texto)

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
  ============================================================
  INICIAR
  ============================================================
  */

  mostrarCanais(canais);

</script>

</html>
