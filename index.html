<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV ao Vivo</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      padding: 15px;
    }

    .canal {
      margin: 20px auto;
      max-width: 900px;
    }

    button {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 14px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    button:hover {
      background: #333;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 20px;
      border-radius: 8px;
    }

    #status {
      margin: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>📺 TV AO VIVO</h1>

  <div class="canal">
    <button onclick="assistir()">
      ▶️ Araruna TV
    </button>
  </div>

  <div id="status">
    Clique no canal para iniciar
  </div>

  <video
    id="video"
    controls
    playsinline
  ></video>

  <script>

    const STREAM =
      "https://video05.logicahost.com.br/ararunatv/ararunatv/playlist.m3u8";
      "https://cdn.jmvstream.com/w/LVW-8155/ngrp:LVW8155_41E1ciuCvO_all/playlist.m3u8;

    
    function assistir() {

      const video =
        document.getElementById("video");

      const status =
        document.getElementById("status");

      status.innerText =
        "Carregando Araruna TV...";

      if (Hls.isSupported()) {

        const hls = new Hls();

        hls.loadSource(STREAM);

        hls.attachMedia(video);

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            status.innerText =
              "✅ Stream carregado";

            video.play().catch(function () {});

          }
        );

        hls.on(
          Hls.Events.ERROR,
          function (event, data) {

            console.log(data);

            status.innerText =
              "❌ Não foi possível reproduzir este canal.";

          }
        );

      }

      else if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src = STREAM;

        video.addEventListener(
          "loadedmetadata",
          function () {

            status.innerText =
              "✅ Stream carregado";

            video.play().catch(function () {});

          },
          { once: true }
        );

      }

      else {

        status.innerText =
          "❌ Seu navegador não suporta HLS.";

      }

    }

  </script>

</body>
</html>
