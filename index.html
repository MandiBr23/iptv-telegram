  <script>

    /* =====================================================

    const tg =

    /* =====================================================

      );

      );

      );

      );

    const linkVlc =

    /* =====================================================
       CARREGAR M3U
       ===================================================== */

    async function carregarM3U() {

      try {

        statusDiv.innerText =
          "Carregando lista de canais...";


        const resposta =
          await fetch(
            M3U_URL,
            {
              cache: "no-store"
            }
          );


        if (!resposta.ok) {

          throw new Error(
            "HTTP " +
            resposta.status
          );

        }


        const texto =
          await resposta.text();


        listaCanais =
          interpretarM3U(
            texto
          );


        if (
          listaCanais.length === 0
        ) {

          throw new Error(
            "Nenhum canal encontrado"
          );

        }


        mostrarCanais(
          listaCanais
        );


        statusDiv.innerText =
          `${listaCanais.length} canais encontrados`;

      }

      catch (e) {

        console.error(
          e
        );


        statusDiv.innerText =
          "❌ Erro ao carregar br.m3u";


        canaisDiv.innerHTML = `

          <div style="
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: #aaa;
          ">

            Não foi possível carregar
            <b>br.m3u</b>.

          </div>

        `;

      }

    }


    /* =====================================================
       INTERPRETAR M3U
       ===================================================== */

    function interpretarM3U(
      texto
    ) {

      const linhas =
        texto.split(
          /\r?\n/
        );

      const canais = [];

      let info = null;


      for (
        let i = 0;
        i < linhas.length;
        i++
      ) {

        const linha =
          linhas[i].trim();


        if (!linha) {
          continue;
        }


        /*
        EXTINF
        */

        if (
          linha
            .toUpperCase()
            .startsWith("#EXTINF")
        ) {

          const virgula =
            linha.lastIndexOf(
              ","
            );


          const nome =
            virgula >= 0
              ? linha
                  .substring(
                    virgula + 1
                  )
                  .trim()
              : "Canal";


          const logoMatch =
            linha.match(
              /tvg-logo=["']([^"']*)["']/i
            );


          const grupoMatch =
            linha.match(
              /group-title=["']([^"']*)["']/i
            );


          info = {

            nome:
              nome || "Canal",

            logo:
              logoMatch
                ? logoMatch[1].trim()
                : "",

            grupo:
              grupoMatch
                ? grupoMatch[1].trim()
                : ""

          };

        }


        /*
        URL DO STREAM
        */

        else if (
          info &&
          !linha.startsWith("#")
        ) {

          let url =
            linha.trim();


          /*
          URL relativa
          */

          if (
            !url.startsWith("http://") &&
            !url.startsWith("https://") &&
            !url.startsWith("rtmp://") &&
            !url.startsWith("rtsp://")
          ) {

            try {

              url =
                new URL(
                  url,
                  M3U_URL
                ).href;

            }

            catch (e) {

              console.error(
                "URL inválida:",
                url
              );

            }

          }


          canais.push({

            nome:
              info.nome,

            logo:
              info.logo,

            grupo:
              info.grupo,

            url:
              url

          });


          info = null;

        }

      }


      return canais;

    }


    /* =====================================================
       MOSTRAR CANAIS
       ===================================================== */

    function mostrarCanais(
      lista
    ) {

      canaisDiv.innerHTML =
        "";


      if (
        !lista.length
      ) {

        canaisDiv.innerHTML = `

          <div style="
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: #999;
          ">

            Nenhum canal encontrado.

          </div>

        `;

        return;

      }


      lista.forEach(
        canal => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "canal";


          let logoHTML =
            "";


          if (
            canal.logo
          ) {

            logoHTML = `

              <img
                class="logo"
                src="${escapar(canal.logo)}"
                alt=""
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="sem-logo"
                style="display:none"
              >
                📺
              </div>

            `;

          }

          else {

            logoHTML = `

              <div class="sem-logo">
                📺
              </div>

            `;

          }


          div.innerHTML = `

            ${logoHTML}

            <div class="nome">

              ${escapar(
                canal.nome
              )}

            </div>

          `;


          div.addEventListener(
            "click",
            function() {

              abrirCanal(
                canal
              );

            }
          );


          canaisDiv.appendChild(
            div
          );

        }
      );

    }


    /* =====================================================
       PESQUISA
       ===================================================== */

    pesquisa.addEventListener(
      "input",
      function() {

        const termo =
          pesquisa.value
            .toLowerCase()
            .trim();


        const filtrados =
          listaCanais.filter(
            canal =>
              canal.nome
                .toLowerCase()
                .includes(
                  termo
                )
          );


        mostrarCanais(
          filtrados
        );


        statusDiv.innerText =
          `${filtrados.length} canais encontrados`;

      }
    );


    /* =====================================================
       ABRIR CANAL
       ===================================================== */

    function abrirCanal(
      canal
    ) {

      canalAtual =
        canal;


      if (hls) {

        hls.destroy();

        hls = null;

      }


      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();


      erro.style.display =
        "none";


      listaContainer.style.display =
        "none";


      playerContainer.style.display =
        "block";


      playerContainer.classList.add(
        "ativo"
      );


      titulo.innerText =
        "📺 " +
        canal.nome;


      informacao.innerHTML = `

        <b>Stream:</b><br>

        ${escapar(
          canal.url
        )}

      `;


      btnTelegram.onclick =
        function() {

          reproduzir(
            canal
          );

        };


      btnVlc.onclick =
        function() {

          abrirVlc(
            canal.url
          );

        };


      btnCopiar.onclick =
        function() {

          copiarTexto(
            canal.url
          );

        };


      /*
      Tenta reproduzir imediatamente.
      */

      reproduzir(
        canal
      );


      /*
      Faz o navegador posicionar
      no início do player.
      */

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       REPRODUZIR
       ===================================================== */

    function reproduzir(
      canal
    ) {

      if (!canal) {
        return;
      }


      if (hls) {

        hls.destroy();

        hls = null;

      }


      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();


      erro.style.display =
        "none";


      /*
      HTTP em página HTTPS
      */

      if (
        location.protocol === "https:" &&
        canal.url.startsWith(
          "http://"
        )
      ) {

        erro.innerHTML = `

          ⚠️ <b>Este canal usa HTTP.</b>

          <br><br>

          O navegador pode bloquear
          a reprodução.

          <br><br>

          Tente:
          <b>📺 Abrir no VLC</b>.

        `;


        erro.style.display =
          "block";


        return;

      }


      /*
      HLS.JS
      */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        hls =
          new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 90

          });


        hls.loadSource(
          canal.url
        );


        hls.attachMedia(
          video
        );


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function() {

            erro.style.display =
              "none";


            video
              .play()
              .catch(
                function() {}
              );

          }
        );


        hls.on(
          Hls.Events.ERROR,
          function(
            event,
            data
          ) {

            console.error(
              "Erro HLS:",
              data
            );


            if (
              data &&
              data.fatal
            ) {

              let mensagem = `

                ❌ <b>Não foi possível
                reproduzir este canal
                no navegador.</b>

                <br><br>

              `;


              if (
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
              ) {

                mensagem += `

                  O servidor pode estar
                  bloqueando o acesso
                  pelo navegador.

                  <br><br>

                  Tente:
                  <b>📺 Abrir no VLC</b>.

                `;

              }

              else if (
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
              ) {

                mensagem += `

                  O navegador não conseguiu
                  decodificar este vídeo.

                `;

              }


              erro.innerHTML =
                mensagem;


              erro.style.display =
                "block";

            }

          }
        );

      }


      /*
      HLS NATIVO
      */

      else if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src =
          canal.url;


        video.addEventListener(
          "loadedmetadata",
          function() {

            video
              .play()
              .catch(
                function() {}
              );

          },
          {
            once: true
          }
        );


        video.addEventListener(
          "error",
          function() {

            erro.innerHTML = `

              ❌ <b>Não foi possível
              reproduzir este canal.</b>

              <br><br>

              Tente:
              <b>📺 Abrir no VLC</b>.

            `;


            erro.style.display =
              "block";

          },
          {
            once: true
          }
        );

      }

      else {

        erro.innerHTML = `

          ❌ Seu navegador não suporta
          reprodução HLS.

        `;


        erro.style.display =
          "block";

      }

    }


    /* =====================================================
       VLC
       ===================================================== */

    function abrirVlc(
      url
    ) {

      const vlcUrl =
        "vlc://" +
        url;


      avisoVlc.style.display =
        "none";


      linkVlc.href =
        vlcUrl;


      modalVlc.style.display =
        "flex";


      linkVlc.onclick =
        function() {

          try {

            window.location.href =
              vlcUrl;

          }

          catch (e) {

            console.error(
              e
            );

          }


          setTimeout(
            function() {

              avisoVlc.style.display =
                "block";

            },
            2000
          );

        };


      copiarVlc.onclick =
        function() {

          copiarTexto(
            url
          );

        };

    }


    /* =====================================================
       MODAL VLC
       ===================================================== */

    fecharModal.onclick =
      function() {

        modalVlc.style.display =
          "none";

      };


    modalVlc.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modalVlc
        ) {

          modalVlc.style.display =
            "none";

        }

      }
    );


    /* =====================================================
       VOLTAR
       ===================================================== */

    voltar.onclick =
      function() {

        video.pause();


        video.removeAttribute(
          "src"
        );


        video.load();


        if (hls) {

          hls.destroy();

          hls = null;

        }


        playerContainer.style.display =
          "none";


        playerContainer.classList.remove(
          "ativo"
        );


        listaContainer.style.display =
          "block";


        erro.style.display =
          "none";


        informacao.innerHTML =
          "";

      };


    /* =====================================================
       COPIAR
       ===================================================== */

    async function copiarTexto(
      texto
    ) {

      try {

        await navigator.clipboard.writeText(
          texto
        );


        alert(
          "✅ Link copiado!"
        );

      }

      catch (e) {

        const area =
          document.createElement(
            "textarea"
          );


        area.value =
          texto;


        area.style.position =
          "fixed";


        area.style.opacity =
          "0";


        document.body.appendChild(
          area
        );


        area.select();


        try {

          document.execCommand(
            "copy"
          );


          alert(
            "✅ Link copiado!"
          );

        }

        catch (erroCopia) {

          alert(
            "Não foi possível copiar automaticamente."
          );

        }


        document.body.removeChild(
          area
        );

      }

    }


    /* =====================================================
       ESCAPAR HTML
       ===================================================== */

    function escapar(
      texto
    ) {

      return String(
        texto
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    carregarM3U();

  </script>
