```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111">

  <title>TV Ao Vivo</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #151515;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #pesquisa {
      width: 100%;
      max-width: 700px;
      padding: 12px 15px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    #pesquisa::placeholder {
      color: #999;
    }

    #status {
      padding: 15px;
      text-align: center;
      color: #aaa;
    }

    #canais {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .canal {
      background: #181818;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      transition: .15s;
    }

    .canal:hover {
      background: #242424;
      transform: translateY(-2px);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 12px;
      object-fit: contain;
      border-radius: 10px;
      background: #101010;
    }

    .sem-logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: #101010;
      border-radius: 10px;
    }

    .nome {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.35;
    }

    #player-container {
      display: none;
      max-width: 1200px;
      margin: auto;
      padding: 15px;
    }

    #voltar {
      border: 1px solid #333;
      background: #202020;
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    #titulo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 10px;
    }

    #erro {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #1b1b1b;
      border-radius: 8px;
      color: #ffaaa0;
      text-align: center;
    }

    @media (max-width: 600px) {
      #canais {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 10px;
      }

      .canal {
        padding: 10px 6px;
      }

      .sem-logo {
        width: 60px;
        height: 60px;
      }

      .nome {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📺 TV AO VIVO</h1>

  <input
    id="pesquisa"
    type="text"
    placeholder="🔎 Pesquisar canal..."
  >
</header>

<div id="status">
  Carregando canais...
</div>

<div id="canais"></div>

<div id="player-container">

  <button id="voltar">
    ← Voltar para os canais
  </button>

  <div id="titulo"></div>

  <video
    id="video"
    controls
    playsinline
  ></video>

  <div id="erro">
    ❌ Não foi possível reproduzir este canal.
  </div>

</div>

<script>

  /*
  =========================================================
  ARQUIVO M3U
  =========================================================
  */

  const M3U_URL = "./br.m3u";


  let listaCanais = [];
  let hls = null;


  const canaisDiv =
    document.getElementById("canais");

  const statusDiv =
    document.getElementById("status");

  const playerContainer =
    document.getElementById("player-container");

  const video =
    document.getElementById("video");

  const titulo =
    document.getElementById("titulo");

  const erro =
    document.getElementById("erro");

  const pesquisa =
    document.getElementById("pesquisa");

  const voltar =
    document.getElementById("voltar");


  /*
  =========================================================
  CARREGAR M3U
  =========================================================
  */

  async function carregarM3U() {

    try {

      const resposta =
        await fetch(M3U_URL, {
          cache: "no-store"
        });

      if (!resposta.ok) {
        throw new Error(
          "HTTP " + resposta.status
        );
      }

      const texto =
        await resposta.text();

      listaCanais =
        interpretarM3U(texto);

      if (!listaCanais.length) {

        throw new Error(
          "Nenhum canal encontrado."
        );

      }

      mostrarCanais(listaCanais);

      statusDiv.innerText =
        `${listaCanais.length} canais encontrados`;

    } catch (e) {

      console.error(e);

      statusDiv.innerText =
        "❌ Erro ao carregar br.m3u";

      canaisDiv.innerHTML = `
        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:30px;
          color:#aaa;
        ">
          Verifique se <b>br.m3u</b>
          está no mesmo local que o index.html.
        </div>
      `;

    }

  }


  /*
  =========================================================
  INTERPRETAR M3U
  =========================================================
  */

  function interpretarM3U(texto) {

    const linhas =
      texto.split(/\r?\n/);

    const canais = [];

    let info = null;

    for (let i = 0; i < linhas.length; i++) {

      const linha =
        linhas[i].trim();

      if (!linha) {
        continue;
      }


      /*
      EXTINF
      */

      if (
        linha.startsWith("#EXTINF")
      ) {

        const nome =
          linha.includes(",")
            ? linha.substring(
                linha.lastIndexOf(",") + 1
              ).trim()
            : "Canal";


        const logoMatch =
          linha.match(
            /tvg-logo="([^"]*)"/i
          );

        const grupoMatch =
          linha.match(
            /group-title="([^"]*)"/i
          );


        info = {

          nome:
            nome || "Canal",

          logo:
            logoMatch
              ? logoMatch[1]
              : "",

          grupo:
            grupoMatch
              ? grupoMatch[1]
              : ""

        };

      }


      /*
      URL DO STREAM
      */

      else if (
        info &&
        !linha.startsWith("#")
      ) {

        canais.push({

          nome: info.nome,

          logo: info.logo,

          grupo: info.grupo,

          url: linha

        });

        info = null;

      }

    }

    return canais;

  }


  /*
  =========================================================
  MOSTRAR CANAIS
  =========================================================
  */

  function mostrarCanais(lista) {

    canaisDiv.innerHTML = "";

    lista.forEach((canal) => {

      const div =
        document.createElement("div");

      div.className = "canal";


      let logoHTML;

      if (canal.logo) {

        logoHTML = `
          <img
            class="logo"
            src="${escapar(canal.logo)}"
            alt=""
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="sem-logo"
            style="display:none"
          >
            📺
          </div>
        `;

      } else {

        logoHTML = `
          <div class="sem-logo">
            📺
          </div>
        `;

      }


      div.innerHTML = `

        ${logoHTML}

        <div class="nome">
          ${escapar(canal.nome)}
        </div>

      `;


      div.onclick =
        () => reproduzir(canal);


      canaisDiv.appendChild(div);

    });

  }


  /*
  =========================================================
  PESQUISA
  =========================================================
  */

  pesquisa.addEventListener(
    "input",
    function() {

      const termo =
        pesquisa.value
          .toLowerCase()
          .trim();

      const filtrados =
        listaCanais.filter(canal =>

          canal.nome
            .toLowerCase()
            .includes(termo)

        );

      mostrarCanais(filtrados);

      statusDiv.innerText =
        `${filtrados.length} canais encontrados`;

    }
  );


  /*
  =========================================================
  REPRODUZIR
  =========================================================
  */

  function reproduzir(canal) {

    if (hls) {

      hls.destroy();
      hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    erro.style.display =
      "none";


    canaisDiv.style.display =
      "none";

    statusDiv.style.display =
      "none";

    playerContainer.style.display =
      "block";


    titulo.innerText =
      "📺 " + canal.nome;


    if (
      window.Hls &&
      Hls.isSupported()
    ) {

      hls =
        new Hls();

      hls.loadSource(
        canal.url
      );

      hls.attachMedia(
        video
      );


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function() {

          video
            .play()
            .catch(() => {});

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function(
          event,
          data
        ) {

          console.error(
            "HLS:",
            data
          );

          if (
            data &&
            data.fatal
          ) {

            erro.style.display =
              "block";

          }

        }
      );

    }

    else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src =
        canal.url;


      video.addEventListener(
        "loadedmetadata",
        function() {

          video
            .play()
            .catch(() => {});

        },
        {
          once: true
        }
      );

    }

    else {

      erro.style.display =
        "block";

    }

  }


  /*
  =========================================================
  VOLTAR
  =========================================================
  */

  voltar.onclick =
    function() {

      video.pause();

      video.removeAttribute("src");

      video.load();


      if (hls) {

        hls.destroy();
        hls = null;

      }


      playerContainer.style.display =
        "none";

      canaisDiv.style.display =
        "grid";

      statusDiv.style.display =
        "block";

    };


  /*
  =========================================================
  ESCAPAR HTML
  =========================================================
  */

  function escapar(texto) {

    return String(texto)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
  =========================================================
  INICIAR
  =========================================================
  */

  carregarM3U();

</script>

</body>
</html>
